<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>
        <h2>Etkinlik Ekle</h2>
        <form>
            <p>
                <label for="ad">Etkinlik Adı</label><br>
                <input type="text" id="ad" name="ad" required>
            </p>

            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="konser">Konser</option>
                    <option value="spor">Spor</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih</label><br>
                <input type="date" id="tarih" name="tarih" required>
            </p>

            <p>
                <label for="saat">Saat</label><br>
                <input type="time" id="saat" name="saat" required>
            </p>

            <p>
                <label for="yer">Yer</label><br>
                <input type="text" id="yer" name="yer" required>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" required></textarea>
            </p>

            <button type="submit">Gönder</button>
        </form>
    </main>

    <footer>
        <p>Abdullah Ahmet Şen · 2416501425 · 2026</p>
    </footer>
</body>
</html>
